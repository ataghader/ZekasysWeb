<body>
  <canvas class="circuit" id="circuit" aria-hidden="true"></canvas>

  <main class="stage">
    <div class="content" id="content">
      <div class="chip-wrap" aria-hidden="true">
        <svg class="chip" viewBox="0 0 220 220" focusable="false">
          <defs>
            <linearGradient id="chipFill" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#0E3A73"/>
              <stop offset="1" stop-color="#061F44"/>
            </linearGradient>
            <filter id="tipGlow" x="-100%" y="-100%" width="300%" height="300%">
              <feGaussianBlur stdDeviation="45"/>
            </filter>
          </defs>
          <g class="pins" stroke="#fff" stroke-opacity=".5" stroke-width="5" stroke-linecap="round">
            <path d="M68 40V22M94 40V22M126 40V22M152 40V22"/>
            <path d="M68 180V198M94 180V198M126 180V198M152 180V198"/>
            <path d="M40 68H22M40 94H22M40 126H22M40 152H22"/>
            <path d="M180 68H198M180 94H198M180 126H198M180 152H198"/>
          </g>
          <rect class="body" x="40" y="40" width="140" height="140" rx="28" fill="url(#chipFill)" stroke="#fff" stroke-opacity=".45" stroke-width="2"/>
          <rect class="body" x="54" y="54" width="112" height="112" rx="20" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
          <!-- The Zekasys "Z" mark, redrawn as a vector from the icon (1254px source grid) -->
          <g transform="translate(110 110) scale(.118) translate(-623.5 -608)">
            <path class="tip-glow" d="M826 780H933A67 67 0 0 1 933 914H826Z" fill="#F48004" filter="url(#tipGlow)"/>
            <path class="z-stroke" pathLength="100" d="M338 369H913L313 847H933" fill="none" stroke="#fff" stroke-width="134" stroke-linecap="round" stroke-linejoin="round"/>
            <path class="z-tip" d="M826 780H933A67 67 0 0 1 933 914H826Z" fill="#F48004"/>
          </g>
        </svg>
      </div>

      <div class="wordmark">
        <img src="assets/logo-white.png" alt="Zekasys" width="360" height="47">
      </div>

      <p class="pill"><span class="live" aria-hidden="true"></span>Website under construction</p>
      <h1>Coming <span class="grad">soon.</span></h1>
      <p class="tagline">Electronics engineering · Ottawa, Canada</p>

      <div class="status" aria-hidden="true">
        <div class="term"><span class="prompt">&gt;</span> <span id="status-text">initializing</span><span class="cursor"></span></div>
        <div class="bar"><span></span></div>
      </div>

      <a class="btn" href="mailto:info@zekasys.com?subject=Hello%20Zekasys">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
